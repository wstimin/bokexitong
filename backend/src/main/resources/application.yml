server:
  port: 8080

spring:
  application:
    name: personal-blog-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/personal_blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:12}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:10000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:3000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1500000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME:300000}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  mail:
    host:
    port: 587
    username:
    password:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

blog:
  version: "${BLOG_VERSION:@project.version@}"
  build-time: "${BLOG_BUILD_TIME:@maven.build.timestamp@}"
  jwt:
    secret: change-this-secret-to-a-long-random-value-for-production
    expiration-minutes: 1440
  upload-dir: uploads
  web-root: file:./frontend/dist/
  install:
    runtime-config-path: ./config/bokexitong-runtime.properties
    restart-after-install: false
  update:
    enabled: ${BLOG_UPDATE_ENABLED:true}
    mode: ${BLOG_UPDATE_MODE:disabled}
    manifest-url: ${BLOG_UPDATE_MANIFEST_URL:https://raw.githubusercontent.com/wstimin/bokexitong/main/package/update-manifest.json}
    request-path: ${BLOG_UPDATE_REQUEST_PATH:./config/update-request.json}
    status-path: ${BLOG_UPDATE_STATUS_PATH:./config/update-status.json}
  article:
    forbidden-words: ${BLOG_ARTICLE_FORBIDDEN_WORDS:赌博,色情,毒品,诈骗}
  admin:
    initial-password:
  mail:
    enabled: false
    from-name: 博客系统
